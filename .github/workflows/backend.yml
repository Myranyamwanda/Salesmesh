name: Backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: salesmesh
          POSTGRES_USER: salesmesh
          POSTGRES_PASSWORD: salesmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salesmesh -d salesmesh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: salesmesh
      POSTGRES_USER: salesmesh
      POSTGRES_PASSWORD: salesmesh
      FRONTEND_URL: http://localhost:5173
      TEST_POSTGRES_DB: salesmesh_test
      JWT_SECRET: ci-only-secret-that-is-not-used-outside-tests
      JWT_ISSUER: salesmesh
      JWT_AUDIENCE: salesmesh-api

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - name: Check formatting and lint
        run: |
          python -m ruff check app tests
          python -m ruff format --check app tests
        working-directory: backend
      - name: Apply migrations
        run: python -m alembic -c alembic.ini upgrade head
        working-directory: backend
      - name: Create test database
        run: >-
          python -c "from psycopg import connect; connection = connect('postgresql://salesmesh:salesmesh@127.0.0.1:5432/postgres', autocommit=True); connection.execute('CREATE DATABASE salesmesh_test'); connection.close()"
        working-directory: backend
      - name: Run tests
        run: python -m pytest -c pyproject.toml tests -q
        working-directory: backend