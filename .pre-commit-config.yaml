repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      # Python files only: the Jupyter notebooks in ml/notebooks are a research
      # record and must not be linted or reformatted.
      - id: ruff-check
        args: [--config, backend/pyproject.toml]
        types_or: [python, pyi]
        exclude: ^ml/notebooks/
      - id: ruff-format
        args: [--config, backend/pyproject.toml]
        types_or: [python, pyi]
        exclude: ^ml/notebooks/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
  - repo: local
    hooks:
      # detect-private-key also catches the key inside; this blocks the file name.
      - id: forbid-firebase-keys
        name: Block Firebase service-account key files
        entry: Firebase service-account keys must stay outside the repository
        language: fail
        files: firebase-admin[^/]*\.json$
      - id: prettier
        name: Prettier
        entry: node frontend/node_modules/prettier/bin/prettier.cjs --check
        language: system
        files: ^frontend/.*\.(css|html|js|json|jsx|md|ts|tsx|yaml|yml)$
      - id: eslint
        name: ESLint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false